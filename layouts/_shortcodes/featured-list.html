{{- /* 精选推荐:文章 front matter 加 featured: true 即自动出现在首页 */ -}}
{{- $featured := where (where site.RegularPages "Params.featured" true) "Draft" false -}}
{{- with $featured -}}
  <h2 class="hx:text-2xl hx:font-bold hx:mt-8 hx:mb-4">精选推荐</h2>
  <div class="home-post-grid">
    {{- range . -}}
      <a class="home-post-card" href="{{ .RelPermalink }}">
        <span class="home-post-title">{{ .Title }}</span>
      </a>
    {{- end -}}
  </div>
{{- end -}}
