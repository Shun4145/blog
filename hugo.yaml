baseURL: "/"
title: "Shun"
theme: "hextra"
enableRobotsTXT: true
defaultContentLanguage: "zh-cn"

params:
  description: "Agent 与 RAG 技术笔记"
  page:
    width: wide
  navbar:
    width: wide
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 26
      height: 26
  search:
    enable: true
    type: flexsearch
    flexsearch:
      js: js/flexsearch-local.min.js
  footer:
    displayCopyright: true
    width: wide
  theme:
    displayToggle: false
  mermaid:
    js: js/mermaid.min.js

menu:
  main:
    - identifier: home
      name: 首页
      pageRef: /
      weight: 10
    - identifier: agent
      name: Agent
      pageRef: /agent
      weight: 20
    - identifier: rag
      name: RAG
      pageRef: /rag
      weight: 30
    - identifier: search
      name: 搜索
      params:
        type: search
        icon: search
      weight: 40
    - identifier: theme-toggle
      name: 主题切换
      params:
        type: theme-toggle
      weight: 50

taxonomies:
  tag: tags
