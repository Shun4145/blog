baseURL: "/"
title: "Shun"
theme: "hextra"
enableRobotsTXT: true
defaultContentLanguage: "zh-cn"

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: "Agent 与 RAG 技术笔记"
  page:
    width: wide
  navbar:
    width: wide
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo-g.svg
      dark: images/logo-g-dark.svg
      width: 26
      height: 26
  search:
    enable: true
    type: flexsearch
    flexsearch:
      js: js/flexsearch-local.min.js
  footer:
    displayCopyright: true
    width: wide
  theme:
    displayToggle: true
  mermaid:
    js: js/mermaid.min.js

menu:
  main:
    - identifier: home
      name: 首页
      pageRef: /
      weight: 10
    - identifier: articles
      name: 文章
      pageRef: /articles
      weight: 20
    - identifier: projects
      name: 项目
      pageRef: /projects
      weight: 30
    - identifier: about
      name: 关于
      pageRef: /about
      weight: 40
    - identifier: theme-toggle
      params:
        type: theme-toggle
      weight: 50

taxonomies:
  tag: tags
